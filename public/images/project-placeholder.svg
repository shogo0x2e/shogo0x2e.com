<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Project image pending</title>
  <desc id="desc">A restrained blue technical grid used until a project image is available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#d9f2fa"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#1685bc" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1440" height="720" fill="url(#bg)"/>
  <rect width="1440" height="720" fill="url(#grid)"/>
  <path d="M96 588H1344M96 132V588" fill="none" stroke="#0e6498" stroke-width="3"/>
  <circle cx="96" cy="588" r="9" fill="#0e6498"/>
  <text x="720" y="380" text-anchor="middle" fill="#0d1a29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34">project image pending</text>
